<!DOCTYPE html>
<html>
    <h1>BIODATA FORM</h1>
    <head>
        <title>BIODATA FORM</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <form id="biodataForm">
            <div class="container">
                <div class="column">
                    <label for="fname"> FULL NAME</label>
                    <input type="text" id="fname" name="fullname" placeholder ="Full Name"required/>

                    <label for="phone"> PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone" placeholder ="Phone Number" required/>
                    

                    <div class="gender-row">
                    <p>GENDER</p>
                    <label for="male">Male</label>
                    <input type="radio" id="male" name="gender" value="male"/>
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="female"/>
                    <label for="other">Other</label>
                    <input type="radio" id="other" name="gender" value="other"/>
                    </div>



                    <label for="Martialstatus">MARTIAL STATUS</label>
                    <select id="Martialstatus" name="Martialstatus" placeholder="Select Martial Status">
                        <option value="">Select</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Divorced">Divorced</option>
                    </select>

                    <label>PROFILE PHOTO</label>
                    <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*"> 




                </div> 



                <div class="column">
                    <label for="email">EMAIL</label>
                    <input type="text" id="email" name="email" placeholder ="Email ID" required/>

                    <label for="dob">DATE OF BIRTH</label>
                    <input type="date" id="dob" name="dob"/>

                    <label for="Nationality">NATIONALITY</label>
                    <select id="Nationality" name="Nationality" placeholder="Select Nationality">
                        <option value="">Select</option>
                        <option value="India">India</option>
                        <option value="America">America</option>
                        <option value="Dubai">Dubai</option>
                    </select>

                    <p>ADDRESS</p>                
                    <textarea id="address" name="address" placeholder ="Address" required></textarea>

                </div> 
            </div>
            <div> 
                <button type="submit">SUBMIT</button>
            </div>
        </form>
        <script src="script.js"></script>
    </body> 
</html>
